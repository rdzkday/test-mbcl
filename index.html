<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Fokus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom ala layar HP. Terang jadi bawaan, gelap lewat tombol di Pengaturan.
   Di layar lebar tampil sebagai "HP" di tengah latar. */
:root {
  --bg-page: #dfe7f5;
  --bg: #f4f5fa;
  --inner: #ffffff;
  --surface: #ffffff;
  --surface-2: #eceef7;
  --track: #e3e6f2;
  --line: #dfe2ee;
  --text: #1c1e2b;
  --muted: #626780;
  --accent: #4f5fe6;
  --accent-text: #3d4ccf;
  --break: #17967f;
  --danger: #c4304a;
  --danger-bg: #fbe3e7;
  --danger-fg: #a8233b;
  --hi: #c4304a;
  --mid: #946000;
  --lo: #147048;
  --shadow: 0 1px 2px rgba(28, 34, 80, .06), 0 6px 16px -8px rgba(28, 34, 80, .14);
  --body-bg: var(--bg);
  --pad: 0px;
}
:root[data-app-theme="dark"] {
  --bg-page: #14151a;
  --bg: #2b2b2e;
  --inner: #232326;
  --surface: #363639;
  --surface-2: #424246;
  --track: #3b3b40;
  --line: #4b4b51;
  --text: #f3f3f6;
  --muted: #a3a3ae;
  --accent: #5a6bf2;
  --accent-text: #a1abff;
  --break: #3db9a2;
  --danger: #ef6b78;
  --danger-bg: #5a3238;
  --danger-fg: #ffd3d7;
  --hi: #ef6b78;
  --mid: #e0a944;
  --lo: #45b884;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--body-bg);
  color: var(--text);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
@media (min-width: 560px) {
  :root { --body-bg: var(--bg-page); --pad: 20px; }
  body { align-items: center; padding-top: 24px; padding-bottom: 24px; }
  .app { max-height: 860px; border-radius: 36px; box-shadow: 0 30px 60px -20px rgba(30, 50, 100, .35); }
}
@media (min-width: 560px) and (max-height: 640px) {
  body { padding-top: 8px; padding-bottom: 8px; }
}

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 22px var(--pad) 12px;
  display: flex; flex-direction: column; gap: 16px;
}
.dock { display: flex; gap: 10px; padding: 8px var(--pad) 8px; }
.dock .btn { flex: 1; }

.eyebrow { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.15; font-weight: 800; text-wrap: balance; }
h2 { margin: 0; font-size: 15px; font-weight: 700; }
.muted { color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; }

.card { background: var(--surface); border-radius: 16px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 14px; padding: 12px; min-width: 0; box-shadow: var(--shadow); }
.tile b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }

.flow { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.flow li { display: flex; align-items: baseline; gap: 12px; counter-increment: s; }
.flow li::before {
  content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface-2); color: var(--accent-text); font-weight: 700; font-size: 13px;
  display: grid; place-items: center; align-self: center;
}
.flow li b { font-weight: 600; }
.flow li span { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }

.btn {
  min-height: 52px; padding: 0 18px; border-radius: 14px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); color: var(--text); text-align: center;
}
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: var(--danger-bg); color: var(--danger-fg); }
.btn:disabled { opacity: .45; }
.btn svg { width: 20px; height: 20px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.center { justify-content: center; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface);
  color: var(--text); font-size: 13px; font-weight: 600; border: 1.5px solid var(--line);
}
.chip.on { border-color: var(--accent); color: var(--accent-text); background: var(--surface); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.form { display: flex; flex-direction: column; gap: 10px; }
.field {
  width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--text);
}
.field::placeholder { color: var(--muted); }
.field:focus { border-color: var(--accent); outline: none; }
.pri { display: flex; gap: 8px; }
.pchip {
  flex: 1; min-height: 40px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
  font-size: 13px; font-weight: 600; border: 1.5px solid transparent;
}
.pchip[aria-pressed="true"] {
  color: var(--pc); border-color: var(--pc);
  background: color-mix(in srgb, var(--pc) 14%, var(--surface-2));
}
.pri-high { --pc: var(--hi); }
.pri-med { --pc: var(--mid); }
.pri-low { --pc: var(--lo); }

.list { display: flex; flex-direction: column; gap: 8px; }
.task {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  background: var(--surface); border-radius: 14px; padding: 8px 10px 8px 6px;
  border: 1.5px solid transparent; text-align: left; width: 100%; box-shadow: var(--shadow);
}
.task.pick.is-checked { border-color: var(--accent); }
.task.crow { padding: 2px 12px 2px 4px; }
.task.crow .name { font-size: 14px; }
.task.dragging { position: relative; z-index: 5; box-shadow: 0 12px 28px rgba(20, 24, 60, .28); border-color: var(--accent); }
.pickbtn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 44px; }
.task .body { flex: 1; min-width: 0; display: block; }
.task .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.task .desc { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.task .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: 12px; color: var(--muted); }
.task .m { display: inline-flex; align-items: center; gap: 5px; }
.pd { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); display: inline-block; }
.task.done .name { text-decoration: line-through; color: var(--muted); }
.grip {
  width: 30px; height: 44px; flex: none; display: grid; place-items: center; color: var(--muted);
  touch-action: none; cursor: grab; border-radius: 8px;
}
.grip:active { cursor: grabbing; }
.grip svg { width: 18px; height: 18px; }
.chk { width: 44px; height: 44px; display: grid; place-items: center; flex: none; border-radius: 50%; }
.dot {
  width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 2px solid var(--pc); background: color-mix(in srgb, var(--pc) 22%, transparent);
}
.dot svg { width: 14px; height: 14px; opacity: 0; stroke: #fff; }
.is-checked .dot { background: var(--pc); }
.is-checked .dot svg { opacity: 1; }
.x { min-width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; font-size: 13px; font-weight: 700; }
.x svg { width: 18px; height: 18px; }
.x.confirm { color: var(--danger-fg); background: var(--danger-bg); padding: 0 12px; }
.linkbtn {
  margin-top: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2);
  color: var(--accent-text); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center;
}

.stage { flex: 1; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.ringwrap { position: relative; width: min(72vw, 260px); aspect-ratio: 1; max-width: 100%; --ring: var(--accent); }
.ringwrap.brk { --ring: var(--break); }
.ringwrap svg { width: 100%; height: 100%; display: block; }
.ringwrap .inner { fill: var(--inner); }
.ringwrap .trk { fill: none; stroke: var(--track); stroke-width: 12; }
.ringwrap .prg {
  fill: none; stroke: var(--ring); stroke-width: 12; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: 130px 130px;
}
.ringtime { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.big { font-size: 56px; font-weight: 800; line-height: 1; white-space: nowrap; }
.mini { font-size: 22px; font-weight: 800; white-space: nowrap; }
.d { display: inline-block; width: .64em; text-align: center; }
.c { display: inline-block; width: .32em; text-align: center; }
.cap { font-size: 13px; color: var(--muted); font-weight: 600; }
.endline {
  margin: 0; padding: 8px 16px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow);
  font-weight: 700; font-size: 14px; text-align: center; font-variant-numeric: tabular-nums;
}
.endline:empty { display: none; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.setrow + .setrow { border-top: 1px solid var(--line); }
.setrow .lbl { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
  font-size: 22px; font-weight: 600; display: grid; place-items: center;
}
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 40px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.songname { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; }
.songname svg { width: 20px; height: 20px; flex: none; color: var(--accent-text); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions .btn { min-height: 44px; font-size: 14px; flex: 1 1 auto; }

.empty { text-align: center; color: var(--muted); padding: 22px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .btn { min-height: 44px; }

.tabbar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  margin: 6px var(--pad) 12px; padding: 6px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
}
.tabbar button {
  position: relative; min-height: 52px; border-radius: 15px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 600;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent-text); background: var(--surface-2); }
.badge { position: absolute; top: 8px; right: calc(50% - 22px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .badge { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
}

.alarm {
  position: absolute; z-index: 20; left: var(--pad); right: var(--pad); top: 12px; margin: 0 8px;
  background: var(--accent); color: #fff; border-radius: 16px; padding: 12px 12px 12px 16px;
  display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(20, 24, 60, .35);
}
.alarm div { flex: 1; min-width: 0; }
.alarm b { display: block; }
.alarm span { font-size: 13px; opacity: .92; }
.alarm button { min-height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(255, 255, 255, .22); font-weight: 700; }
.alarm[hidden], .toast[hidden] { display: none; }
.toast {
  position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 92px; width: max-content; max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; text-align: center;
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="alarm" id="alarm" role="alert" hidden></div>
  <main class="view" id="view"></main>
  <nav class="tabbar" id="nav" aria-label="Menu utama"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="songfile" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.opus" hidden>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var now = function () { return Date.now(); };
  var KEY = 'pomo.v1';
  var LIM = { plan: [1, 15], cf: [1, 120], cb: [1, 60] };
  var PRI = { high: 'Tinggi', med: 'Sedang', low: 'Rendah' };
  var C = 2 * Math.PI * 118;
  var RESET_HOUR = 5;

  function svg(inner, w) {
    return '<svg viewBox="0 0 24 24" width="' + (w || 22) + '" height="' + (w || 22) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  var ICON = {
    timer: svg('<circle cx="12" cy="14" r="7.5"/><path d="M12 14V10M9.5 2.5h5M12 6.5V4.5"/>'),
    list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/>'),
    set: svg('<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 14),
    x: svg('<path d="M6 6l12 12M18 6L6 18"/>', 18),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 20),
    play: svg('<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>', 20),
    pause: svg('<path d="M8 5v14M16 5v14"/>', 20),
    note: svg('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>', 20),
    grip: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>'
  };

  /* ---------- state ---------- */
  function def() {
    return { tasks: [], settings: { plan: 5, cf: 15, cb: 3 }, theme: 'light', pre: 0, phase: 'idle', timer: null,
      sel: [], session: [], last: [], log: [], fromBreak: false, tab: 'fokus', dayStart: 0 };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw), d = def(), ds = d.settings;
        var s = Object.assign(d, o);
        s.settings = Object.assign(ds, o.settings || {});
        s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
        s.tasks.forEach(function (t, i) {
          if (t.ord == null) t.ord = t.at || i;
          if (t.spent == null) t.spent = 0;
        });
        if (typeof s.pre !== 'number') s.pre = 0;
        s.theme = s.theme === 'dark' ? 'dark' : 'light';
        return s;
      }
    } catch (e) {}
    return def();
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function applyTheme() { document.documentElement.setAttribute('data-app-theme', S.theme === 'dark' ? 'dark' : 'light'); }
  applyTheme();

  var D = { title: '', desc: '', pri: 'med', open: false };
  var filter = 'all', delId = null, delT = null, confirmStop = false, csT = null;
  var songMeta = null, hasSong = false, objUrl = null, clearing = false, previewing = false;
  var lastDigits = '', lastKey = '', drag = null;

  var uid = function () { return Math.random().toString(36).slice(2, 9) + now().toString(36); };
  var task = function (id) { return S.tasks.filter(function (t) { return t.id === id; })[0]; };
  function nextOrd() {
    var m = now();
    S.tasks.forEach(function (t) { if (t.ord >= m) m = t.ord + 1; });
    return m;
  }

  /* ---------- hari Fokus (reset 05.00) ---------- */
  function dayStartOf(ts) {
    var d = new Date(ts);
    d.setHours(RESET_HOUR, 0, 0, 0);
    if (d.getTime() > ts) d.setDate(d.getDate() - 1);
    return d.getTime();
  }
  function visible(t) { return Math.max(t.at || 0, t.bring || 0) >= S.dayStart; }
  function fokusPending() {
    return S.tasks.filter(function (t) { return !t.done && visible(t); })
      .sort(function (a, b) { return a.ord - b.ord; });
  }
  function hiddenCount() { return S.tasks.filter(function (t) { return !t.done && !visible(t); }).length; }
  function rollover() {
    var ds = dayStartOf(now());
    if (S.dayStart === ds) return false;
    if (S.phase === 'idle' || S.phase === 'select') {
      S.dayStart = ds; S.phase = 'idle'; S.timer = null;
      S.sel = []; S.session = []; S.last = []; D.open = false; confirmStop = false;
      save();
      return true;
    }
    return false;
  }

  /* ---------- format ---------- */
  function fmtDate(ts) { return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }); }
  function fmtTime(ts) { return new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function fmtDT(ts) { return fmtDate(ts) + ', ' + fmtTime(ts); }
  function dur(sec) {
    if (sec < 60) return '<1 mnt';
    var m = Math.round(sec / 60);
    if (m < 60) return m + ' mnt';
    var h = Math.floor(m / 60), r = m % 60;
    return h + ' j' + (r ? ' ' + r + ' mnt' : '');
  }
  function presets() {
    return [
      { f: 25, b: 5, l: '25 / 5' },
      { f: 50, b: 10, l: '50 / 10' },
      { f: S.settings.cf, b: S.settings.cb, l: S.settings.cf + ' / ' + S.settings.cb + ' kustom' }
    ];
  }

  /* ---------- audio ---------- */
  var audio = new Audio();
  audio.preload = 'auto';
  var ctx = null, beepNodes = [], capT = null, playing = false, unlocked = false;

  function getCtx() {
    try {
      if (!ctx) { var A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); }
      return ctx;
    } catch (e) { return null; }
  }
  function unlockAudio() {
    var c = getCtx();
    if (c && c.state === 'suspended') c.resume().catch(function () {});
    if (!unlocked && hasSong && !playing) {
      audio.muted = true;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { audio.pause(); audio.currentTime = 0; audio.muted = false; unlocked = true; })
          .catch(function () { audio.muted = false; });
      } else { audio.muted = false; }
    }
  }
  document.addEventListener('pointerdown', unlockAudio, { passive: true });

  function beep() {
    var c = getCtx(); if (!c) return;
    var t0 = c.currentTime + 0.05;
    for (var i = 0; i < 12; i++) {
      var o = c.createOscillator(), g = c.createGain(), t = t0 + i * 0.5;
      o.type = 'sine'; o.frequency.value = i % 2 ? 784 : 988;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g); g.connect(c.destination);

  function startSound() {

      '<button type="button" data-act="stopAlarm">Hentikan musik</button>';

  /* ---------- song storage (IndexedDB) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('pomo-media', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }
  function idbGet() {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var q = d.transaction('kv').objectStore('kv').get('song');
        q.onsuccess = function () { res(q.result || null); };
        q.onerror = function () { rej(q.error); };
      });
    }).catch(function () { return null; });
  }
  function idbSet(v) {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, 'song');
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    }).catch(function () { return false; });
  }
  function idbDel() {
    return idb().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete('song');
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () { return false; });
  }
  function setAudioBlob(blob) {

    hasSong = true; unlocked = false;
  }
  function clearAudio() {
    clearing = true;

  }

    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|wav|ogg|aac|flac|opus)$/i.test(file.name)) {
      toast('Pilih file audio (mp3, m4a, wav, ogg).'); return;
    }
    stopSound(true); previewing = false;
    setAudioBlob(file);
    songMeta = { name: file.name, size: file.size };

      toast(ok ? 'Lagu disimpan di browser ini.' : 'Lagu aktif, tapi tidak bisa disimpan. Pilih ulang setelah halaman dibuka lagi.');
    });
    render();
  }

  /* ---------- wake lock ---------- */
  var lock = null;

    var run = S.timer && S.timer.status === 'running';

      navigator.wakeLock.request('screen').then(function (l) {
        lock = l; l.addEventListener('release', function () { lock = null; });
      }).catch(function () {});
    } else if (!run && lock) { try { lock.release(); } catch (e) {} lock = null; }
  }

  /* ---------- timer ---------- */
  function remMs(t) { return t.status === 'running' ? Math.max(0, t.endAt - now()) : t.remaining * 1000; }
  function mk(kind, total, status, brkMin) {
    var t = { kind: kind, total: total, status: status, remaining: total, brkMin: brkMin };
    if (status === 'running') { t.endAt = now() + total * 1000; t.segStart = now(); }
    return t;
  }
  function run(t) {
    t.status = 'running'; t.endAt = now() + t.remaining * 1000; t.segStart = now();
  }
  /* catat lama fokus ke tugas sesi yang belum selesai */
  function credit() {

    var end = Math.min(now(), t.endAt), el = Math.max(0, (end - t.segStart) / 1000);
    S.session.forEach(function (id) {
      var k = task(id);

    t.segStart = end;

  function digits(ms) {
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    var str = String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    return str.split('').map(function (ch) {
      return ch === ':' ? '<span class="c">:</span>' : '<span class="d">' + ch + '</span>';
    }).join('');
  }

    var h = digits(ms);

    var r = $('#ring'); if (r) r.style.strokeDashoffset = C * (1 - frac);
    var b = $('#bar'); if (b) b.style.width = ((1 - frac) * 100) + '%';
    var e = $('#endt');
    if (e) {
      var lead = t.kind === 'break' ? 'Istirahat selesai pukul ' : 'Selesai pukul ';
      var txt;
      if (t.status === 'running') txt = lead + fmtTime(t.endAt);

      else txt = 'Dijeda. Jam selesai dihitung ulang saat lanjut.';

  function tick() {

      paint(t, remMs(t));

  function goSelect(fromBreak, keepSel) {

    confirmStop = false;

      body: hdr('Semua yang pernah dibuat', 'To-do') +
        '<div class="tiles"><div class="tile"><b>' + act.length + '</b><span>Aktif</span></div>' +
        '<div class="tile"><b>' + dn.length + '</b><span>Selesai</span></div>' +
        '<div class="tile"><b>' + S.log.length + '</b><span>Total pomodoro</span></div></div>' +
        '<div class="seg" role="group" aria-label="Filter">' + seg + '</div>' +
        (D.open ? formHTML() : '<button class="btn" data-act="toggleForm">' + ICON.plus + 'Tambah tugas</button>') + list
    };
  }
  function stepper(label, sub, k) {
    var v = S.settings[k], mn = LIM[k][0], mx = LIM[k][1];
    return '<div class="setrow"><div><div class="lbl">' + label + '</div><div class="sub">' + sub + '</div></div>' +
      '<div class="stepper"><button data-act="step" data-k="' + k + '" data-d="-1" aria-label="Kurangi ' + label + '"' + (v <= mn ? ' disabled' : '') + '>&minus;</button>' +
      '<output aria-live="polite">' + v + '</output>' +
      '<button data-act="step" data-k="' + k + '" data-d="1" aria-label="Tambah ' + label + '"' + (v >= mx ? ' disabled' : '') + '>+</button></div></div>';
  }
  function viewSetelan() {
    var s = S.settings;
    var size = songMeta && songMeta.size ? ' · ' + (songMeta.size / 1048576).toFixed(1) + ' MB' : '';
    var themeSeg = [['light', 'Terang'], ['dark', 'Gelap']].map(function (x) {
      return '<button data-act="theme" data-v="' + x[0] + '" aria-pressed="' + (S.theme === x[0]) + '">' + x[1] + '</button>';
    }).join('');
    return {
      body: hdr('Atur sesuai ritme kamu', 'Pengaturan') +
        '<div class="card"><h2>Tampilan</h2><div class="seg" style="margin-top:10px" role="group" aria-label="Tampilan">' + themeSeg + '</div></div>' +
        '<div class="card"><h2>Waktu pomodoro</h2>' +
        '<p class="sub" style="margin:6px 0 0">Sebelum mulai fokus, kamu bisa memilih 25 / 5, 50 / 10, atau pilihan ketiga. Pilihan ketiga bisa kamu ubah di sini (awalnya 15 / 3).</p>' +
        stepper('Kustom: fokus', 'menit', 'cf') +
        stepper('Kustom: istirahat', 'menit', 'cb') +
        stepper('Menyusun to-do', 'menit di awal sesi', 'plan') + '</div>' +
        '<div class="card"><h2>Musik alarm</h2>' +
        '<div class="songname" style="margin-top:10px">' + ICON.note + '<span>' + (hasSong && songMeta ? esc(songMeta.name) + '<span class="sub">' + size + '</span>' : 'Nada bawaan') + '</span></div>' +
        '<div class="actions"><button class="btn" data-act="pickSong">Pilih lagu dari perangkat</button>' +
        '<button class="btn" data-act="preview">' + (previewing ? 'Hentikan' : 'Coba putar') + '</button>' +
        (hasSong ? '<button class="btn" data-act="defaultSong">Pakai nada bawaan</button>' : '') + '</div>' +
        '<p class="sub" style="margin:12px 0 0">Musik berhenti sendiri setelah 30 detik. Lagu disimpan di browser ini, jadi di HP lain perlu dipilih lagi.</p></div>'
    };
  }

  function renderNav() {
    var items = [['fokus', 'Fokus', ICON.timer], ['todo', 'To-do', ICON.list], ['setelan', 'Pengaturan', ICON.set]];
    var running = S.timer && S.timer.status === 'running';
    $('#nav').innerHTML = items.map(function (i) {
      return '<button type="button" data-act="tab" data-v="' + i[0] + '"' + (S.tab === i[0] ? ' aria-current="page"' : '') + '>' +
        i[2] + '<span>' + i[1] + '</span>' + (i[0] === 'fokus' && running ? '<i class="badge" title="Timer berjalan"></i>' : '') + '</button>';
    }).join('');
  }
  function render() {
    drag = null;
    var v = $('#view'), sc = $('.scroll', v), top = sc ? sc.scrollTop : 0;
    var key = S.tab + ':' + S.phase;
    var out = S.tab === 'fokus' ? viewFokus() : S.tab === 'todo' ? viewTodo() : viewSetelan();
    v.innerHTML = '<div class="scroll">' + out.body + '</div>' + (out.dock ? '<div class="dock">' + out.dock + '</div>' : '');
    var n = $('.scroll', v);
    if (n) n.scrollTop = key === lastKey ? top : 0;
    lastKey = key;
    renderNav();
    if (S.timer && S.tab === 'fokus') paint(S.timer, remMs(S.timer)); else if (!S.timer) document.title = 'Pomodoro Fokus';
  }

  var toastT;
  function toast(m) {
    var t = $('#toast'); t.textContent = m; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3500);
  }

  /* ---------- actions ---------- */
  function act(a, d) {
    var id = d.id;
    switch (a) {
      case 'tab': S.tab = d.v; D.open = false; break;
      case 'startPlan':
        unlockAudio(); S.phase = 'plan'; D.open = false;
        S.timer = mk('plan', S.settings.plan * 60, 'running'); break;
      case 'cancelPlan': S.phase = 'idle'; S.timer = null; break;
      case 'finishPlan': goSelect(false); break;
      case 'toSelect': goSelect(false); break;
      case 'closeSession': S.phase = 'idle'; S.timer = null; S.sel = []; D.open = false; break;
      case 'pri': D.pri = d.v; break;
      case 'toggleForm': D.open = !D.open; break;
      case 'pick':
        var i = S.sel.indexOf(id);
        if (i > -1) S.sel.splice(i, 1); else S.sel.push(id);
        break;
      case 'selAll': S.sel = fokusPending().map(function (t) { return t.id; }); break;
      case 'selNone': S.sel = []; break;
      case 'selLast': S.sel = S.last.map(task).filter(function (t) { return t && !t.done; }).map(function (t) { return t.id; }); break;
      case 'ready':
        if (!S.sel.length) return;
        unlockAudio(); S.session = S.sel.slice(); S.phase = 'focus'; D.open = false;
        S.timer = mk('focus', 25 * 60, 'ready', 5);
        applyPre(0); break;
      case 'pickPre': applyPre(Number(d.i)); break;
      case 'backSelect': goSelect(false, true); break;
      case 'startTimer': unlockAudio(); run(S.timer); break;
      case 'pause':
        credit();
        S.timer.remaining = Math.max(0, (S.timer.endAt - now()) / 1000);
        S.timer.status = 'paused'; delete S.timer.endAt; delete S.timer.segStart; break;
      case 'resume': unlockAudio(); run(S.timer); break;
      case 'stop':
        if (confirmStop) { credit(); confirmStop = false; S.last = S.session.slice(); goSelect(false, true); }
        else {
          confirmStop = true; clearTimeout(csT);
          csT = setTimeout(function () { confirmStop = false; render(); }, 4000);
        }
        break;
      case 'skipBreak': goSelect(true); break;
      case 'toggleDone':
        var t = task(id);
        if (t) {
          if (!t.done) { credit(); t.done = true; t.doneAt = now(); S.sel = S.sel.filter(function (x) { return x !== id; }); }
          else { t.done = false; t.doneAt = null; }
        }
        break;
      case 'bring':
        var bt = task(id);
        if (bt) { bt.bring = now(); bt.ord = nextOrd(); toast('Ditambahkan ke halaman Fokus hari ini.'); }
        break;
      case 'del':
        if (delId === id) {
          S.tasks = S.tasks.filter(function (x) { return x.id !== id; });
          ['sel', 'session', 'last'].forEach(function (k) { S[k] = S[k].filter(function (x) { return x !== id; }); });
          delId = null;
        } else {
          delId = id; clearTimeout(delT);
          delT = setTimeout(function () { delId = null; render(); }, 3000);
        }
        break;
      case 'filter': filter = d.v; break;
      case 'sample':
        [['Susun kerangka laporan', 'Outline dan poin utama', 'high'], ['Balas email yang tertunda', '', 'med'], ['Rapikan folder unduhan', '', 'low']].forEach(function (x) {
          S.tasks.push({ id: uid(), title: x[0], desc: x[1], pri: x[2], at: now(), ord: nextOrd(), done: false, pomos: 0, spent: 0 });
        });
        break;
      case 'step':
        var k = d.k, nv = S.settings[k] + Number(d.d);
        S.settings[k] = Math.max(LIM[k][0], Math.min(LIM[k][1], nv));
        if (S.pre === 2) applyPre(2);
        break;
      case 'theme': S.theme = d.v === 'dark' ? 'dark' : 'light'; applyTheme(); break;
      case 'pickSong': $('#songfile').click(); return;
      case 'defaultSong':
        stopSound(true); previewing = false; clearAudio(); songMeta = null; idbDel(); toast('Memakai nada bawaan.'); break;
      case 'preview':
        unlockAudio();
        if (previewing) { stopSound(); return; }
        previewing = true; startSound(); break;
      case 'stopAlarm': stopSound(); return;
      default: return;
    }
    save(); render(); syncWake();
  }

  var app = $('#app');
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b && app.contains(b)) act(b.dataset.act, b.dataset);
  });
  app.addEventListener('input', function (e) {
    var k = e.target.dataset && e.target.dataset.draft;
    if (k) D[k] = e.target.value;
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, title = $('#f-title', f).value.trim(), desc = $('#f-desc', f).value.trim();
    if (!title) { toast('Isi nama tugas dulu.'); $('#f-title', f).focus(); return; }
    var t = { id: uid(), title: title, desc: desc, pri: D.pri, at: now(), ord: nextOrd(), done: false, pomos: 0, spent: 0 };
    S.tasks.push(t);
    if (S.phase === 'select' && S.tab === 'fokus') S.sel.push(t.id);
    D.title = ''; D.desc = '';
    save(); render();
    var ft = $('#f-title'); if (ft) ft.focus();
  });
  $('#songfile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    onSong(f);
  });

  /* ---------- drag urutan ---------- */
  app.addEventListener('pointerdown', function (e) {
    var g = e.target.closest('.grip');
    if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
    var row = g.closest('.task'), list = row && row.parentNode;
    if (!list || list.dataset.sort == null) return;
    e.preventDefault();
    var r = row.getBoundingClientRect();
    drag = { row: row, list: list, off: e.clientY - r.top, id: e.pointerId, scroller: list.closest('.scroll') };
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    row.classList.add('dragging');
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    var row = drag.row, list = drag.list, sc = drag.scroller;
    if (sc) {
      var sr = sc.getBoundingClientRect();
      if (e.clientY < sr.top + 36) sc.scrollTop -= 10;
      else if (e.clientY > sr.bottom - 36) sc.scrollTop += 10;
    }
    row.style.transform = '';
    var top = e.clientY - drag.off, center = top + row.offsetHeight / 2, target = null, kids = list.children;
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k === row) continue;
      var kr = k.getBoundingClientRect();
      if (kr.top + kr.height / 2 > center) { target = k; break; }
    }
    if (row.nextElementSibling !== target) list.insertBefore(row, target);
    var nat = row.getBoundingClientRect().top;
    row.style.transform = 'translateY(' + (top - nat) + 'px)';
  }, { passive: false });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    d.row.style.transform = ''; d.row.classList.remove('dragging');
    applyOrder([].map.call(d.list.children, function (r) { return r.dataset.id; }));
    save(); render();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  app.addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.grip');
    if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var row = g.closest('.task'), list = row.parentNode;
    if (list.dataset.sort == null) return;
    var ids = [].map.call(list.children, function (r) { return r.dataset.id; });
    var i = ids.indexOf(g.dataset.id), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (i < 0 || j < 0 || j >= ids.length) return;
    var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    applyOrder(ids); save(); render();
    var ng = $('.grip[data-id="' + g.dataset.id + '"]'); if (ng) ng.focus();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { tick(); syncWake(); }
  });

  /* ---------- start ---------- */
  if (S.timer && S.timer.status === 'running' && S.timer.endAt <= now()) {
    complete(true);
  }
  rollover();
  render();
  syncWake();
  setInterval(tick, 250);
  idbGet().then(function (r) {
    if (r && r.blob) { setAudioBlob(r.blob); songMeta = { name: r.name, size: r.size }; render(); }
  });
})();
</script>

</body>
</html>
